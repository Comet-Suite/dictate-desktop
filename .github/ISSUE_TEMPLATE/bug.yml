name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, private transcripts or sensitive audio."
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quantization
      placeholder: Parakeet Unified Q4_K_M
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
