name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libportaudio2 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          python -m pip install -r requirements-dev.txt
      - name: Compile and lint
        run: |
          python -m py_compile dictate.py
          python -m ruff check dictate.py --select F,E9
      - name: Qt, recording, focus, symbols and insertion regressions
        run: |
          xvfb-run -a -s '-screen 0 1600x1100x24' env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1.25 python -m pytest -q
