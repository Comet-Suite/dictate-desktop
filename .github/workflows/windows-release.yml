name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit, branch or existing tag to verify
        required: true
        default: main
      tag:
        description: Version tag matching the source metadata
        required: true
        default: v1.2.6
      publish:
        description: Publish only after verification (requires the version tag to exist)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  regression:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  build:
    needs: regression
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Verify native keyboard capture and teardown before packaging
        shell: pwsh
        run: python tools/check_windows_shortcuts.py --report release/smoke-keyboard-source.json
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Compile, verify native runtimes, install and smoke-test
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid version tag" }
          $version = $env:RELEASE_TAG.Substring(1)
          .\packaging\build.ps1 -Version $version -TestNativeModels -TestInstaller
      - name: Upload build diagnostics and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: |
            release/*
            build/Dictate/warn-Dictate.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $files = Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".zip" -or $_.Name -in "SHA256SUMS.txt", "requirements-build-resolved.txt", "smoke-frozen.json", "smoke-installed.json"
          } | ForEach-Object { $_.FullName }
          git fetch --no-tags --depth=1 origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { throw "The publication tag does not exist or could not be fetched." }
          $sourceCommit = git rev-parse HEAD
          $tagCommit = git rev-parse "$($env:RELEASE_TAG)^{commit}"
          if ($sourceCommit -ne $tagCommit) { throw "Refusing to publish bytes from a different commit than the release tag." }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Refusing to overwrite an existing release or its historical assets."
          }
          gh release create $env:RELEASE_TAG @files --verify-tag --title "Dictate $($env:RELEASE_TAG.Substring(1)) for Windows" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
